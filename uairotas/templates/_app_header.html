<header class="app-header">
  <a class="app-logo" href="{{ url_for('main.home') }}" aria-label="UaiRotas — página inicial">
    <span class="app-logo__mark" aria-hidden="true">
      <svg viewBox="0 0 48 48"><path d="M8 32.5c4.8-9.4 10-14.1 16-14.1 5.1 0 8.8 2.4 11.2 7.2"/><path d="M9 35h30"/><circle cx="15" cy="35" r="4"/><circle cx="33" cy="35" r="4"/><path d="M26 9l7 7-7 7"/></svg>
    </span>
    <span>Uai<span>Rotas</span></span>
  </a>

  <button class="nav-toggle" type="button" data-nav-toggle aria-label="Abrir menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <nav class="main-nav" data-main-nav aria-label="Navegação principal">
    <a class="main-nav__link{% if active_page == 'home' %} is-active{% endif %}" href="{{ url_for('main.home') }}"{% if active_page == 'home' %} aria-current="page"{% endif %}>Home</a>
    <a class="main-nav__link{% if active_page == 'routes' %} is-active{% endif %}" href="{{ url_for('main.routes') }}"{% if active_page == 'routes' %} aria-current="page"{% endif %}>Rotas</a>
    <a class="main-nav__link{% if active_page == 'fleet' %} is-active{% endif %}" href="{{ url_for('main.fleet') }}"{% if active_page == 'fleet' %} aria-current="page"{% endif %}>Frota</a>
    <a class="main-nav__link{% if active_page == 'reports' %} is-active{% endif %}" href="{{ url_for('main.reports') }}"{% if active_page == 'reports' %} aria-current="page"{% endif %}>Relatórios</a>
    <a class="main-nav__link" href="#" aria-label="Usuários — em desenvolvimento">Usuários</a>
  </nav>

  <div class="header-actions">
    <button class="icon-button" type="button" data-theme-toggle aria-label="Ativar modo escuro" aria-pressed="false">
      <svg class="theme-icon theme-icon--sun" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="theme-icon theme-icon--moon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z"/></svg>
    </button>

    <details class="profile-menu">
      <summary aria-label="Abrir menu do perfil">
        <span class="profile-avatar" aria-hidden="true">{{ current_user.name[:1] | upper }}</span>
        <span class="profile-copy"><strong>{{ current_user.name }}</strong><small>{{ current_user.role | capitalize }}</small></span>
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m7 9 5 5 5-5"/></svg>
      </summary>
      <div class="profile-dropdown">
        <p><strong>{{ current_user.name }}</strong><span>{{ current_user.email }}</span></p>
        <form method="post" action="{{ url_for('auth.logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M10 4H5v16h5M14 8l4 4-4 4M18 12H9"/></svg>Sair</button>
        </form>
      </div>
    </details>
  </div>
</header>
